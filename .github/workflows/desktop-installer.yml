# بناء برنامج التنصيب لسطح المكتب (BHOME Setup.exe)
# يبني الواجهة محليًّا (npm run build:desktop) ويحزمها داخل المثبّت — وضع
# desktop-local: يعمل من ملفّاتٍ محلّيّة لا من الموقع البعيد. يُشغَّل يدويًّا أو
# عند تغيّر القشرة أو الاعتماديات، وكلُّ تشغيلٍ يُعيد بناء الواجهة من المصدر الحاليّ.
name: Build Desktop Installer

on:
  push:
    branches: ['main']
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.desktop.mjs'
      - '.github/workflows/desktop-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and release installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: 'BHOME Desktop v__VERSION__'
          releaseBody: |
            📦 برنامج تنصيب BHOME لويندوز

            حمّل الملف المنتهي بـ `-setup.exe` من الأسفل وثبّته.
            أول تشغيل يحتاج اتصالًا بالإنترنت (دخول + مزامنة أولى)، ثم يعمل دون اتصال.
            التحديثات تصل تلقائيًّا عبر الويب — لا حاجة لإعادة التنصيب.
          releaseDraft: false
          prerelease: false
