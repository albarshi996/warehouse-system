# بناء تطبيق أندرويد (BHOME.apk) — نسخة الموبايل الأوفلاين (local-sqlite)، تُبنى
# في CI لأنّ Rust/Android لا يُصرَّفان محلّيًّا. تُنشَر كـ«ما قبل الإصدار» (prerelease)
# بوسمٍ مستقلّ (android-v*) فلا تمسّ latest.json لسطح المكتب.
#
# أوّلُ هدف: APK تجريبيّ (debug) قابلٌ للتحميل والتثبيت — يُثبت تصريفَ rusqlite
# لأندرويد وسقالةَ Tauri. التوقيعُ الثابت للتحديث يأتي في طورٍ تالٍ.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.desktop.mjs'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  NDK_VERSION: '26.1.10909125'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${NDK_VERSION}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@^2

      - name: Versions
        run: |
          node --version
          rustc --version
          echo "NDK_HOME=$NDK_HOME"
          npx tauri --version

      - name: Tauri Android init
        run: npx tauri android init --ci

      - name: Build Android APK (debug)
        run: npx tauri android build --apk --debug

      - name: Collect APK
        id: apk
        run: |
          set -e
          APK=$(find src-tauri/gen/android -path '*apk*' -name '*.apk' | sort | tail -1)
          echo "Found APK: $APK"
          test -n "$APK"
          cp "$APK" "BHOME-android-debug.apk"
          ls -la BHOME-android-debug.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.17
          name: BHOME Android v1.0.17 (debug)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            📱 نسخة أندرويد من BHOME (تجريبيّة · أوفلاين محليّ).
            حمّل `BHOME-android-debug.apk` وثبّته (اسمح بـ«تثبيت من مصدر غير معروف»).
            هذه نسخةُ إثباتٍ للبناء؛ التوقيعُ الثابت والتحديثُ الذاتيّ في الطور التالي.
          files: BHOME-android-debug.apk
