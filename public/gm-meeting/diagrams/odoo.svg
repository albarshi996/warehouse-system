</defs>
<g class="pop p1"><rect x="600" y="40" width="200" height="246" rx="18" fill="#fff" stroke="#e8e8ec" stroke-width="1.3" filter="url(#sh)"/><rect x="600" y="40" width="200" height="50" rx="18" fill="#C41017"/><rect x="600" y="74" width="200" height="16" fill="#C41017"/><text x="700" y="63" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">نظام Odoo</text><text x="700" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe0e1">ERP المعتمد</text><text x="700" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">دورة الشراء والتوريد</text><rect x="625" y="138" width="150" height="1" fill="#e8e8ec"/><text x="700" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">القيود والمخزون المحاسبي</text><rect x="625" y="172" width="150" height="1" fill="#e8e8ec"/><text x="700" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">التقارير المالية</text><rect x="625" y="206" width="150" height="1" fill="#e8e8ec"/></g><g class="pop p2"><rect x="370" y="40" width="200" height="246" rx="18" fill="#fff" stroke="#e8e8ec" stroke-width="1.3" filter="url(#sh)"/><rect x="370" y="40" width="200" height="50" rx="18" fill="#E11B22"/><rect x="370" y="74" width="200" height="16" fill="#E11B22"/><text x="470" y="63" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">البوابة التفاعلية</text><text x="470" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe0e1">التنفيذ والتوثيق</text><text x="470" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">الاستلام والجرد والتخزين</text><rect x="395" y="138" width="150" height="1" fill="#e8e8ec"/><text x="470" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">الباركود ومواقع التخزين</text><rect x="395" y="172" width="150" height="1" fill="#e8e8ec"/><text x="470" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">الصلاحيات والأدوار</text><rect x="395" y="206" width="150" height="1" fill="#e8e8ec"/></g><g class="pop p3"><rect x="140" y="40" width="200" height="246" rx="18" fill="#fff" stroke="#e8e8ec" stroke-width="1.3" filter="url(#sh)"/><rect x="140" y="40" width="200" height="50" rx="18" fill="#F5333A"/><rect x="140" y="74" width="200" height="16" fill="#F5333A"/><text x="240" y="63" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">العمليات التشغيلية</text><text x="240" y="81" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe0e1">الأرض والفريق</text><text x="240" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">المناولة والنقل</text><rect x="165" y="138" width="150" height="1" fill="#e8e8ec"/><text x="240" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">المستندات الميدانية</text><rect x="165" y="172" width="150" height="1" fill="#e8e8ec"/><text x="240" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4f57">الأمن والسلامة</text><rect x="165" y="206" width="150" height="1" fill="#e8e8ec"/></g><path class="draw d2" style="--len:60" d="M600 163 L570 163" stroke="#E11B22" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path class="draw d3" style="--len:60" d="M570 200 L600 200" stroke="#8a919b" stroke-width="2.4" fill="none" marker-end="url(#ar2)"/><circle class="flow f1" r="4" fill="#c8a44e"><animateMotion dur="2.2s" repeatCount="indefinite" path="M600 163 L570 163"/></circle><path class="draw d3" style="--len:60" d="M370 163 L340 163" stroke="#E11B22" stroke-width="2.4" fill="none" marker-end="url(#ar)"/><path class="draw d4" style="--len:60" d="M340 200 L370 200" stroke="#8a919b" stroke-width="2.4" fill="none" marker-end="url(#ar2)"/><circle class="flow f2" r="4" fill="#c8a44e"><animateMotion dur="2.2s" repeatCount="indefinite" path="M370 163 L340 163"/></circle><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#E11B22"/></marker><marker id="ar2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#8a919b"/></marker></defs><text x="470" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a919b">الدورة المستندية واحدة؛ ما يتغير هو مكان التنفيذ ومكان القيد</text></svg>