<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" role="img" aria-label="نموذج توزيع المهام على أدوات الذكاء الاصطناعي">
<style>
  text{font-family:'IBM Plex Sans Arabic','Segoe UI',sans-serif;direction:rtl;unicode-bidi:plaintext}
  text.en{direction:ltr;unicode-bidi:isolate}
  .draw{stroke-dashoffset:0!important}
  .pop{opacity:1!important}
  .grow{transform:none!important}
  .flow{display:none}
  .pulse{opacity:.28}
</style>
<defs>
  <linearGradient id="gr" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5333A"/><stop offset="1" stop-color="#6E070A"/></linearGradient>
  <linearGradient id="gg" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#C41017"/><stop offset="1" stop-color="#E11B22"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6E070A" flood-opacity=".22"/></filter>
</defs>
<rect class="pop p1" x="700" y="110" width="200" height="74" rx="16" fill="url(#gr)" filter="url(#sh)"/><text x="800" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مهمة محددة</text><text x="800" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd9da">بمخرج ومعيار قبول</text><path class="draw d1" style="--len:160" d="M700 147 C640 147 620 60 560 60" stroke="#F5333A" stroke-width="1.6" fill="none" opacity=".5"/><circle class="flow f1" r="3.5" fill="#c8a44e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.0s" path="M700 147 C640 147 620 60 560 60"/></circle><g class="pop p2"><rect x="300" y="44" width="260" height="34" rx="10" fill="#fff" stroke="#e8e8ec" stroke-width="1.1"/><rect x="556" y="44" width="4" height="34" rx="2" fill="#E11B22"/><text x="544" y="66" text-anchor="end" font-size="11.8" font-weight="700" fill="#1a1c1f">مطابقة الجرد على مستوى الباركود</text></g><path class="draw d2" style="--len:60" d="M300 61 L250 61" stroke="#8a919b" stroke-width="1.4" fill="none" opacity=".45"/><g class="pop p3"><rect x="20" y="44" width="230" height="34" rx="10" fill="#f1faf6" stroke="#c8e9dc" stroke-width="1"/><text x="235" y="66" text-anchor="end" font-size="11.5" font-weight="700" fill="#0a6e4c">ملفات مطابقة قابلة للتدقيق</text></g><path class="draw d2" style="--len:160" d="M700 147 C640 147 620 114 560 114" stroke="#F5333A" stroke-width="1.6" fill="none" opacity=".5"/><circle class="flow f2" r="3.5" fill="#c8a44e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.3s" path="M700 147 C640 147 620 114 560 114"/></circle><g class="pop p3"><rect x="300" y="98" width="260" height="34" rx="10" fill="#fff" stroke="#e8e8ec" stroke-width="1.1"/><rect x="556" y="98" width="4" height="34" rx="2" fill="#E11B22"/><text x="544" y="120" text-anchor="end" font-size="11.8" font-weight="700" fill="#1a1c1f">تفريغ التسجيلات والاجتماعات</text></g><path class="draw d3" style="--len:60" d="M300 115 L250 115" stroke="#8a919b" stroke-width="1.4" fill="none" opacity=".45"/><g class="pop p4"><rect x="20" y="98" width="230" height="34" rx="10" fill="#f1faf6" stroke="#c8e9dc" stroke-width="1"/><text x="235" y="120" text-anchor="end" font-size="11.5" font-weight="700" fill="#0a6e4c">محاضر موثقة بأسماء وتواريخ</text></g><path class="draw d3" style="--len:160" d="M700 147 C640 147 620 168 560 168" stroke="#F5333A" stroke-width="1.6" fill="none" opacity=".5"/><circle class="flow f3" r="3.5" fill="#c8a44e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.7s" path="M700 147 C640 147 620 168 560 168"/></circle><g class="pop p4"><rect x="300" y="152" width="260" height="34" rx="10" fill="#fff" stroke="#e8e8ec" stroke-width="1.1"/><rect x="556" y="152" width="4" height="34" rx="2" fill="#E11B22"/><text x="544" y="174" text-anchor="end" font-size="11.8" font-weight="700" fill="#1a1c1f">إعداد التقارير التشغيلية والهندسية</text></g><path class="draw d4" style="--len:60" d="M300 169 L250 169" stroke="#8a919b" stroke-width="1.4" fill="none" opacity=".45"/><g class="pop p5"><rect x="20" y="152" width="230" height="34" rx="10" fill="#f1faf6" stroke="#c8e9dc" stroke-width="1"/><text x="235" y="174" text-anchor="end" font-size="11.5" font-weight="700" fill="#0a6e4c">تقارير جاهزة للعرض</text></g><path class="draw d4" style="--len:160" d="M700 147 C640 147 620 222 560 222" stroke="#F5333A" stroke-width="1.6" fill="none" opacity=".5"/><circle class="flow f4" r="3.5" fill="#c8a44e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.0s" path="M700 147 C640 147 620 222 560 222"/></circle><g class="pop p5"><rect x="300" y="206" width="260" height="34" rx="10" fill="#fff" stroke="#e8e8ec" stroke-width="1.1"/><rect x="556" y="206" width="4" height="34" rx="2" fill="#E11B22"/><text x="544" y="228" text-anchor="end" font-size="11.8" font-weight="700" fill="#1a1c1f">المراجعة والتدقيق المستقل للأرقام</text></g><path class="draw d5" style="--len:60" d="M300 223 L250 223" stroke="#8a919b" stroke-width="1.4" fill="none" opacity=".45"/><g class="pop p6"><rect x="20" y="206" width="230" height="34" rx="10" fill="#f1faf6" stroke="#c8e9dc" stroke-width="1"/><text x="235" y="228" text-anchor="end" font-size="11.5" font-weight="700" fill="#0a6e4c">تصحيحات مُدمجة ومُسندة</text></g><path class="draw d5" style="--len:160" d="M700 147 C640 147 620 276 560 276" stroke="#F5333A" stroke-width="1.6" fill="none" opacity=".5"/><circle class="flow f1" r="3.5" fill="#c8a44e"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.4s" path="M700 147 C640 147 620 276 560 276"/></circle><g class="pop p6"><rect x="300" y="260" width="260" height="34" rx="10" fill="#fff" stroke="#e8e8ec" stroke-width="1.1"/><rect x="556" y="260" width="4" height="34" rx="2" fill="#E11B22"/><text x="544" y="282" text-anchor="end" font-size="11.8" font-weight="700" fill="#1a1c1f">تطوير البوابة ومراجعة الكود</text></g><path class="draw d6" style="--len:60" d="M300 277 L250 277" stroke="#8a919b" stroke-width="1.4" fill="none" opacity=".45"/><g class="pop p7"><rect x="20" y="260" width="230" height="34" rx="10" fill="#f1faf6" stroke="#c8e9dc" stroke-width="1"/><text x="235" y="282" text-anchor="end" font-size="11.5" font-weight="700" fill="#0a6e4c">تحسينات مستمرة موثقة</text></g><text x="800" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#8a919b">المدخل</text><text x="430" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#8a919b">المهام الموزّعة</text><text x="135" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#8a919b">المخرجات الموثقة</text><rect class="grow g4" x="20" y="344" width="880" height="32" rx="16" fill="#fdeeee"/><text x="460" y="365" text-anchor="middle" font-size="12.5" font-weight="800" fill="#C41017">كل مخرج يمر بمراجعة بشرية، وكل رقم مُسند إلى مصدره — لا يُنشر مخرج دون تحقق</text></svg>