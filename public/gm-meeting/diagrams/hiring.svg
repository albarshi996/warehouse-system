    <stop offset="0" stop-color="#C41017"/><stop offset="1" stop-color="#E11B22"/></linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6E070A" flood-opacity=".22"/></filter>
</defs>
<g class="pop p1"><rect x="804" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="804" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="872" cy="140" r="15" fill="url(#gr)"/><text class="en" x="872" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">01</text></g><text x="872" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">طلب وظيفي</text><text x="872" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">موصوف</text><path class="draw d1" style="--len:22" d="M801 158 L789 158" stroke="#F5333A" stroke-width="2.2" fill="none"/><g class="pop p2"><rect x="650" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="650" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="718" cy="140" r="15" fill="url(#gr)"/><text class="en" x="718" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">02</text></g><text x="718" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">توصيف المهام</text><text x="718" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">والصلاحيات</text><path class="draw d2" style="--len:22" d="M647 158 L635 158" stroke="#F5333A" stroke-width="2.2" fill="none"/><g class="pop p3"><rect x="496" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="496" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="564" cy="140" r="15" fill="url(#gr)"/><text class="en" x="564" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">03</text></g><text x="564" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">الفرز</text><text x="564" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">الأولي</text><path class="draw d3" style="--len:22" d="M493 158 L481 158" stroke="#F5333A" stroke-width="2.2" fill="none"/><g class="pop p4"><rect x="342" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="342" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="410" cy="140" r="15" fill="url(#gr)"/><text class="en" x="410" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">04</text></g><text x="410" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">مقابلة فنية مع</text><text x="410" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">الإدارة الطالبة</text><path class="draw d4" style="--len:22" d="M339 158 L327 158" stroke="#F5333A" stroke-width="2.2" fill="none"/><g class="pop p5"><rect x="188" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="188" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="256" cy="140" r="15" fill="url(#gr)"/><text class="en" x="256" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">05</text></g><text x="256" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">فترة تجربة</text><text x="256" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">محددة</text><path class="draw d5" style="--len:22" d="M185 158 L173 158" stroke="#F5333A" stroke-width="2.2" fill="none"/><g class="pop p6"><rect x="34" y="110" width="136" height="96" rx="15" fill="#fff" stroke="#e8e8ec" stroke-width="1.2" filter="url(#sh)"/><rect x="34" y="110" width="136" height="5" rx="3" fill="url(#gg)"/><circle cx="102" cy="140" r="15" fill="url(#gr)"/><text class="en" x="102" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">06</text></g><text x="102" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">اعتماد</text><text x="102" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1c1f">التعيين</text><rect class="grow" x="20" y="42" width="920" height="30" rx="15" fill="#fdeeee"/><text x="480" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#C41017">آلية واحدة لكل تعيين — لا استثناء إلا بقرار مكتوب</text></svg>