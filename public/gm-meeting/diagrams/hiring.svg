<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-label="مسار آلية التوظيف المقترحة">
<style>
  text{font-family:'IBM Plex Sans Arabic','Segoe UI',sans-serif;direction:rtl;unicode-bidi:plaintext}
  text.en{direction:ltr;unicode-bidi:isolate}
  .draw{stroke-dashoffset:0!important}
  .pop{opacity:1!important}
  .grow{transform:none!important}
  .flow{display:none}
  .pulse{opacity:.28}
</style>
<defs>
  <linearGradient id="gr" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5333A"/><stop offset="1" stop-color="#6E070A"/></linearGradient>
