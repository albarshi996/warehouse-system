[package]
name = "brandzo-hub"
version = "1.0.2"
description = "BHOME — نظام إدارة مستودعات BHOME (قشرة سطح مكتب حول النظام السحابي)"
authors = ["Mohammed AlBarshi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ★ قاعدة SQLite مدمجةٌ في البرنامج (ميزة bundled تُجمّع SQLite من المصدر، فلا
#   يحتاج جهازُ المستخدم تنصيبَ أيّ شيء). هذا هو «المخزنُ على الجهاز» الذي تُكتب
#   فيه البيانات — بابُه الوحيد أوامرُ db.rs، والمنطقُ كلُّه في JavaScript المُختبَر.
rusqlite = { version = "0.32", features = ["bundled"] }
